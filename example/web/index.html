<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <title>example</title>
  <style>
    @font-face {
      font-family: 'Roboto';
      src: local('Arial'), local('sans-serif');
    }
    * { font-family: 'Roboto', Arial, sans-serif !important; }
  </style>
  <script>
    const originalFetch = window.fetch;
    window.fetch = function() {
      if (arguments[0] && typeof arguments[0] === 'string' && (arguments[0].includes('fonts.googleapis.com') || arguments[0].includes('fonts.gstatic.com'))) {
        return Promise.reject(new Error('Offline Mode: Fonts Blocked'));
      }
      return originalFetch.apply(this, arguments);
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const config = { renderer: 'html' };
          const appRunner = await engineInitializer.initializeEngine(config);
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
